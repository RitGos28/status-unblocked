# One address for the whole app: the React app at / (it routes with #/...,
# so it needs only index.html and /assets/), and every other path - /api, the
# server-rendered pages, /evidence links in digests and issues, /healthz -
# goes to the backend. Put this one port behind a tunnel or reverse proxy and
# set STANDUP_BASE_URL to its public address.
server {
    listen 80;
    root /usr/share/nginx/html;

    location = / {
        try_files /index.html =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
