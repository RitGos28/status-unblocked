{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
<p class="sub">Your team's code, and the name your team knows you by. There are no passwords.</p>

{% if error %}
<div class="card" style="border-color:var(--warn)"><p style="margin:0;color:var(--warn)">{{ error }}</p></div>
{% endif %}

<form method="post" action="/login" class="card">
  <label for="team_code" style="margin-top:0">Team code <span class="hint">anyone on your team can read it off their Team page</span></label>
  <input id="team_code" name="team_code" type="text" value="{{ team_code }}" placeholder="e.g. CORE-7K3MQ" autocomplete="off" autocapitalize="characters" spellcheck="false" required>
  <label for="name">Your name <span class="hint">as your team lists you</span></label>
  <input id="name" name="name" type="text" value="{{ name }}" placeholder="e.g. Aarav Sharma" autocomplete="name" required>
  <p style="margin:18px 0 0"><button type="submit">Sign in</button></p>
</form>
{% endblock %}
