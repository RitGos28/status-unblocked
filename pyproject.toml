[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "status-unblocked"
version = "0.1.0"
description = "Async standup bot producing faithful, citation-backed daily digests"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.135.0",  # bumped from 0.115.6: microsoft-agents-hosting-fastapi needs starlette>=1.0, capped below that pre-0.135
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "structlog==24.4.0",
    "jinja2==3.1.5",
    "itsdangerous==2.2.0",  # signed login links and the session cookie
    "tzdata>=2025.2",  # IANA zones for zoneinfo on hosts without a system tz database
    "python-multipart==0.0.20",
    "microsoft-agents-activity==1.5.0",
    "microsoft-agents-hosting-core==1.5.0",
    "microsoft-agents-hosting-fastapi==1.5.0",
    "microsoft-agents-hosting-msteams==1.5.0",  # verified via PyPI 2026-09-17; see CLAUDE.md Teams invariant
]

[project.optional-dependencies]
# Only needed when STANDUP_DATABASE_URL points at Postgres; local dev on
# SQLite does not pull this in.
postgres = ["psycopg[binary]==3.2.3"]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "ruff==0.8.6",
    "mypy==1.14.1",
    "import-linter==2.1",
    "hypothesis==6.123.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
standup = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "live_github: hits the real GitHub API; excluded from CI",
]

[tool.coverage.run]
source = ["standup"]

[tool.coverage.report]
# Overall floor. The gate that matters, >=90% on summarize/ and privacy/, is
# checked per module in CI with --include.
fail_under = 90

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Alembic writes these; they are generated artifacts, not hand-maintained code.
extend-exclude = ["src/standup/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.11"
packages = ["standup"]
mypy_path = "src"
strict = true
warn_return_any = false

[[tool.mypy.overrides]]
module = "tests.*"
strict = false

# The dependency rule from CLAUDE.md, enforced.
[tool.importlinter]
root_package = "standup"

[[tool.importlinter.contracts]]
name = "domain is pure (imports nothing from the project)"
type = "forbidden"
source_modules = ["standup.domain"]
forbidden_modules = [
    "standup.api",
    "standup.db",
    "standup.ingestion",
    "standup.summarize",
    "standup.tracker",
    "standup.privacy",
    "standup.scheduling",
    "standup.config",
    "standup.auth",
]

# The prompt boundary. summarize.service is the orchestrator and is allowed to
# do I/O; everything it calls must stay pure, so that whatever crosses into a
# summarizer is only ever a SummaryRequest.
[[tool.importlinter.contracts]]
name = "the summarizer core is pure (the prompt boundary)"
type = "forbidden"
source_modules = [
    "standup.summarize.base",
    "standup.summarize.rules",
    "standup.summarize.validator",
    "standup.summarize.render",
]
forbidden_modules = [
    "standup.api",
    "standup.db",
    "standup.ingestion",
    "standup.tracker",
    "standup.privacy",
    "standup.config",
    "standup.auth",
]
